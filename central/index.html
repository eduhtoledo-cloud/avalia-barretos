<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Central Avalia Brasil</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#0B0F19">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
<script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
<script src="../config.js?v=6"></script>
<script src="config.js?v=1"></script>
<style>
:root{
  --bg:#F3F5FA; --card:#fff; --ink:#0F172A; --body:#334155; --muted:#64748B; --line:#E5E9F2;
  --brand:#1A5CE5; --brand-h:#1449BC; --brand-soft:#EAF1FF;
  --ok:#0F9D58; --ok-soft:#E7F6EE; --bad:#D93025; --bad-soft:#FDECEA; --warn:#B26A00; --warn-soft:#FFF4DE;
  --violet:#6D4AE0; --violet-soft:#EFEAFF; --dark:#0B0F19; --star:#FFC21A; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;max-width:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14.5px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- login ---------- */
#auth{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 20% -10%,#1E3A8A 0,transparent 60%),var(--dark)}
.auth-box{width:100%;max-width:380px;background:var(--card);border-radius:20px;padding:28px 24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;letter-spacing:-.02em}
.logo img{width:30px;height:30px;border-radius:8px}
.logo b{background:linear-gradient(90deg,#009C3B,#D9A400);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{font-weight:600;font-size:12px;color:var(--muted);letter-spacing:0;margin-left:2px}
.auth-box h1{font-size:20px;margin:22px 0 4px;letter-spacing:-.02em}
.auth-box p.sub{color:var(--muted);margin-bottom:18px}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin:18px 0 6px}
.tabs button{flex:1;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg{font-size:13px;border-radius:10px;padding:10px 12px;margin-top:12px}
.msg.err{background:var(--bad-soft);color:var(--bad)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
.link{color:var(--brand);font-weight:600;font-size:13px}

/* ---------- formulário ---------- */
label.f{display:block;margin-top:12px}
label.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--body);margin-bottom:5px}
.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none;min-height:42px}
.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
textarea.in{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;font-weight:700;background:var(--brand);color:#fff;transition:background .15s}
.btn:hover{background:var(--brand-h)}
.btn.full{width:100%;margin-top:18px}
.btn.ghost{background:var(--bg);color:var(--ink)} .btn.ghost:hover{background:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;color:var(--body)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:600;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--brand)}

/* ---------- app ---------- */
#app{min-height:100svh;display:flex}
aside{width:232px;flex-shrink:0;background:var(--dark);color:#fff;padding:20px 14px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column}
aside .logo{color:#fff;padding:0 8px 22px}
aside .logo b{background:linear-gradient(90deg,#2BD46B,#FFD21A);-webkit-background-clip:text;background-clip:text}
nav.side a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;color:rgba(255,255,255,.7);text-decoration:none;font-weight:600;margin-bottom:2px;cursor:pointer}
nav.side a:hover{background:rgba(255,255,255,.06);color:#fff}
nav.side a.on{background:rgba(255,255,255,.1);color:#fff}
nav.side svg,nav.bottom svg{width:19px;height:19px;flex-shrink:0}
.me{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.1);font-size:13px}
.me b{display:block;color:#fff} .me span{color:rgba(255,255,255,.5);font-size:12px}
.me button{color:rgba(255,255,255,.7);font-size:12.5px;font-weight:600;margin-top:8px}
main{flex:1;min-width:0;max-width:100%;overflow-x:clip;padding:22px 28px 110px}
#app{max-width:100vw;overflow-x:clip}
.row > *,.row3 > *,.tools > *,.pform > *,.atv-form > *{min-width:0}
input,select,textarea{max-width:100%;min-width:0}
input[type=date],input[type=month],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:42px;width:100%}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h2{font-size:22px;letter-spacing:-.02em;margin-right:auto}
.top .in{width:auto;min-height:38px;padding:7px 10px}
.mtop{display:none}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi small{display:block;color:var(--muted);font-weight:600;font-size:12.5px}
.kpi b{display:block;font-size:23px;letter-spacing:-.02em;margin-top:6px}
.kpi em{font-style:normal;font-size:12px;color:var(--muted);display:block;margin-top:3px}
.kpi.pos b{color:var(--ok)} .kpi.neg b{color:var(--bad)}
.two{grid-template-columns:1.4fr 1fr;margin-top:14px}
.card h3{font-size:14.5px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--muted);font-size:12px}

.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:8px}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bars .pair{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:3px}
.bars .pair i{display:block;width:42%;max-width:22px;border-radius:5px 5px 2px 2px;min-height:2px}
.bars .pair i.a{background:var(--brand)} .bars .pair i.b{background:#F59E0B}
.bars .m span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:capitalize}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.hb{margin-bottom:11px} .hb:last-child{margin-bottom:0}
.hb div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.hb div span{color:var(--muted)}
.hb .tr{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--brand);border-radius:9px}

.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-pago,.p-cliente,.p-entrada{background:var(--ok-soft);color:var(--ok)}
.p-pendente,.p-negociando{background:var(--warn-soft);color:var(--warn)}
.p-enviado,.p-lead,.p-investimento{background:var(--brand-soft);color:var(--brand)}
.p-entregue{background:var(--violet-soft);color:var(--violet)}
.p-cancelado,.p-perdido,.p-despesa{background:var(--bad-soft);color:var(--bad)}
.p-custo{background:#F1F5F9;color:#475569}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools .in{width:auto;flex:1;min-width:160px}
.tools select.in{flex:0 1 170px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li:hover{background:#FAFBFE}
.li .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .v{font-weight:800;text-align:right;white-space:nowrap}
.lv{grid-template-columns:62px 1fr auto auto}
.lc{grid-template-columns:1fr auto auto}
.lf{grid-template-columns:62px 1fr auto auto}
.dt{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.dt b{display:block;color:var(--ink);font-size:17px}
.sum{display:flex;justify-content:space-between;padding:12px 16px;background:#FAFBFE;border-top:1px solid var(--line);font-weight:700;font-size:13.5px;gap:10px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.fab{position:fixed;right:24px;bottom:24px;z-index:20;height:54px;padding:0 20px 0 16px;border-radius:999px;background:var(--brand);color:#fff;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 12px 30px rgba(26,92,229,.4)}
.fab svg{width:22px;height:22px}

/* ---------- modal ---------- */
dialog{border:0;border-radius:18px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100svh - 32px);margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(11,15,25,.55)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.mh h3{font-size:17px}
.mh button{width:34px;height:34px;border-radius:9px;font-size:20px;color:var(--muted)}
.mh button:hover{background:var(--bg)}
.mb{padding:4px 20px 20px}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.mf .btn.danger{margin-right:auto}
.kits{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kits button{border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:#fff;text-align:center;font-size:12px;color:var(--muted);line-height:1.3}
.kits button b{display:block;color:var(--ink);font-size:13.5px}
.kits button.on{border-color:var(--brand);background:var(--brand-soft)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.hist{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.hist div{display:flex;justify-content:space-between;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;gap:8px}
.hist div:first-child{border-top:0;background:#FAFBFE;font-weight:700}
.qa{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qa a{flex:1;min-width:120px;text-decoration:none}

.ac{position:relative}
.acbox{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.14);z-index:5;max-height:300px;overflow:auto;padding:4px 0}
.acbox h6{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px}
.acbox button{display:block;width:100%;text-align:left;padding:9px 12px;line-height:1.3}
.acbox button:hover,.acbox button.sel{background:var(--brand-soft)}
.acbox button b{display:block;font-size:13.5px;font-weight:700}
.acbox button small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acbox p{padding:10px 12px;font-size:12.5px;color:var(--muted)}
.vinc{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--ok-soft);color:#0B6B3D;font-size:12.5px;line-height:1.4}
.vinc b{color:var(--ink)} .vinc a{color:var(--brand);font-weight:700;white-space:nowrap}
.vinc.old{background:var(--brand-soft);color:var(--brand-h)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:14px 0}
.prod h4{font-size:14.5px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.prod .sal{font-size:30px;font-weight:900;letter-spacing:-.03em;margin:8px 0 2px}
.prod .sal small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.prod p{font-size:12.5px;color:var(--muted)}
.prod .qa{margin-top:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.cfx{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cfx:first-of-type{border-top:0}
.cfx b{display:block;font-size:13.5px;cursor:pointer} .cfx small{font-size:12px;color:var(--muted)}
.q-pos{color:var(--ok)} .q-neg{color:var(--bad)}
.rolagem{max-height:372px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.55);margin-top:6px}
.syncbtn{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.75);font-size:12.5px;font-weight:600;padding:5px 0}
.syncbtn:hover{color:#fff}
.syncbtn svg{width:15px;height:15px}
.syncbtn.girando svg{animation:gira .6s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.mtop .syncbtn{color:var(--body);width:34px;height:34px;justify-content:center;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0}
.mtop .syncbtn span{display:none}
.mtop .sync{color:var(--muted);margin:0}
.p-contato{background:#E0F2FE;color:#0369A1}
.p-agendado{background:var(--violet-soft);color:var(--violet)}
.p-oport{background:#FFF1E6;color:#C2410C}
.avisos{border-left:4px solid #F59E0B;margin-bottom:14px}
.avisos .cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.av-h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:12px 0 2px}
.av-h:first-child{margin-top:0}
.av-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.av-h + .av-item{border-top:0}
.av-item b{display:block;font-size:13.5px} .av-item small{display:block;font-size:12px;color:var(--muted)}
.av-item small.late{color:var(--bad);font-weight:700}
.av-item .acts{display:flex;gap:6px;flex-shrink:0}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;align-items:start}
.kcol{background:#E9EDF5;border-radius:14px;padding:10px;min-height:160px;transition:outline .1s}
.kcol.over{outline:2px dashed var(--brand);outline-offset:-2px}
.kcol h4{font-size:13px;display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px}
.kcol .kbody{max-height:68vh;overflow-y:auto}
.kcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.kcard[draggable=true]{cursor:grab}
.kcard b{display:block;font-size:13.5px;line-height:1.3}
.kcard small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.kcard .prox{font-size:12px;margin-top:6px;font-weight:600;color:var(--violet)}
.kcard .prox.late{color:var(--bad)}
.kcard .kact{display:flex;gap:6px;margin-top:8px}
.kcard .kact a,.kcard .kact button{font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px;background:var(--bg);color:var(--ink);text-decoration:none}
.kcard .kact a.wa{background:#25D366;color:#fff}
.atv{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px}
.atv-form{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.atv-li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.atv-li:first-of-type{border-top:0}
.atv-li .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:12px;color:#fff}
.atv-li .ck.on{background:var(--ok);border-color:var(--ok)}
.atv-li small{display:block;color:var(--muted);font-size:12px}
.atv-li .x{margin-left:auto;color:var(--muted);font-size:16px;padding:0 4px}
.pform{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;margin-bottom:12px}
.medal{text-align:center;font-weight:800;color:var(--muted)}
@media (max-width:820px){ .avisos .cols{grid-template-columns:1fr} .pform{grid-template-columns:1fr 1fr} .pform .btn{grid-column:1/-1} .atv-form{grid-template-columns:1fr} }
.dhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.dhead h2{font-size:24px;letter-spacing:-.02em}
.dhead p{color:var(--muted);font-size:13px;margin-top:2px}
.dhead .icons{margin-left:auto;display:flex;gap:8px}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--body)}
.ibtn:hover{background:var(--bg)} .ibtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ibtn svg{width:17px;height:17px}
.periodos{display:flex;gap:4px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%}
.periodos button{padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.periodos button.on{background:var(--brand);color:#fff}
.periodos input{border:0;font:inherit;font-size:12.5px;color:var(--body);padding:4px 6px;border-left:1px solid var(--line);background:transparent;max-width:150px}
.gk{position:relative;overflow:hidden;border-radius:16px;padding:18px 18px 16px;color:#fff;min-height:118px;isolation:isolate}
.gk::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 52%,rgba(255,255,255,.07) 52%,rgba(255,255,255,.07) 74%,transparent 74%);z-index:-1}
.gk small{font-size:12.5px;font-weight:600;opacity:.9}
.gk b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.gk em{font-style:normal;font-size:11.5px;opacity:.85;display:block}
.gk em i{font-style:normal;font-weight:700;opacity:1}
.gk .ic{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.gk .ic svg{width:17px;height:17px}
.gk.g1{background:linear-gradient(135deg,#0B6B57,#064E3B)} .gk.g2{background:linear-gradient(135deg,#0E9F7A,#047857)}
.gk.g3{background:linear-gradient(135deg,#C27C0E,#8A4B07)} .gk.g4{background:linear-gradient(135deg,#4F46E5,#312E81)} .gk.g5{background:linear-gradient(135deg,#E0364F,#9F1239)}
.d2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}

<script>
/* ===================== utilidades ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const somaMes = (ym, d) => { let [y,m] = ym.split("-").map(Number); m += d; while (m < 1){m+=12;y--} while (m > 12){m-=12;y++} return y + "-" + String(m).padStart(2,"0"); };

const F = { vBusca:"", vStatus:"", vVend:"", vServ:"", cBusca:"", cStatus:"", cModo:"carteira", rPer:"semana", crmVend:"", crmBusca:"", lTipo:"" };

  $("#authBody").innerHTML = `

  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => telaLogin(b.dataset.m));
  const esq = $("#esqueci");

    e.preventDefault();

    if (!email) { $("#authMsg").innerHTML = `<div class="msg err">Digite seu e-mail acima e clique de novo.</div>`; return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    $("#authMsg").innerHTML = error ? `<div class="msg err">${esc(error.message)}</div>` : `<div class="msg ok">Enviamos um link para ${esc(email)} criar uma senha nova.</div>`;
  };
  $("#fAuth").onsubmit = async e => {
    e.preventDefault();
    const f = e.target, btn = f.querySelector("button.btn"); btn.disabled = true;
    const email = f.email.value.trim(), senha = f.senha.value;
    let r;
    if (criar) r = await sb.auth.signUp({ email, password: senha, options: { data: { nome: f.nome.value.trim() }, emailRedirectTo: location.origin + location.pathname } });
    else r = await sb.auth.signInWithPassword({ email, password: senha });
    btn.disabled = false;
    if (r.error){
      if (/not confirmed/i.test(r.error.message)){
        $("#authMsg").innerHTML = `<div class="msg err">Falta confirmar seu e-mail. Abra o e-mail que enviamos para ${esc(email)} (veja também o spam/lixo eletrônico) e clique no link.<br><a href="#" class="link" id="reenviar">Reenviar e-mail de confirmação</a></div>`;
        $("#reenviar").onclick = async e => {
          e.preventDefault();
          const x = await sb.auth.resend({ type: "signup", email, options: { emailRedirectTo: location.origin + location.pathname } });
          $("#authMsg").innerHTML = x.error ? `<div class="msg err">Não deu para reenviar agora (${esc(x.error.message)}). Peça ao administrador para confirmar seu acesso.</div>` : `<div class="msg ok">Enviamos de novo para ${esc(email)}. Confira também o spam.</div>`;
        };
        return;
      }
      const m = /Invalid login/i.test(r.error.message) ? "E-mail ou senha incorretos." : /already registered/i.test(r.error.message) ? "Esse e-mail já tem acesso. Use Entrar." : /rate limit/i.test(r.error.message) ? "Muitas tentativas seguidas. Espere alguns minutos e tente de novo." : r.error.message;
      $("#authMsg").innerHTML = `<div class="msg err">${esc(m)}</div>`; return;
    }
    if (r.data.session) entrar(r.data.user);
    else $("#authMsg").innerHTML = `<div class="msg ok">Acesso criado! Confirme pelo link que enviamos para ${esc(email)} e depois entre.</div>`;
  };
}

const vendasValidas = arr => arr.filter(v => v.status !== "cancelado");
function numerosDoMes(ym){ return numerosPeriodo(ym + "-01", ym + "-31"); }
function numerosPeriodo(ini, fim){
  const dentro = d => d >= ini && d <= fim;
  const vs = vendasValidas(vendas.filter(v => dentro(v.data)));
  const ls = lanc.filter(l => dentro(l.data));
  const fat = soma(vs, v => v.valor);
  const entradas = soma(ls.filter(l => l.tipo === "entrada"), l => l.valor);
  const custoVendas = soma(vs, v => v.custo);
  const custos = custoVendas + soma(ls.filter(l => l.tipo === "custo"), l => l.valor);
  const despesas = soma(ls.filter(l => l.tipo === "despesa"), l => l.valor);
  const invest = soma(ls.filter(l => l.tipo === "investimento"), l => l.valor);
  const saidas = custos + despesas + invest;
  return { vs, ls, fat, entradas, custoVendas, custos, despesas, invest, saidas,
           resultado: fat + entradas - saidas, placas: soma(vs, v => v.qtd),
           receber: soma(vs.filter(v => v.status === "pendente"), v => v.valor),
           insta: soma(vs, v => v.qtd_insta || 0),
           gNovo: vs.filter(v => servDe(v).includes("google_novo")).length,
           gAtual: vs.filter(v => servDe(v).includes("google_atualizacao")).length,
           compras: soma(movs.filter(m => m.tipo === "entrada" && dentro(m.data)), m => m.qtd * m.custo_unit) };
}

function graficoArea(pr){
  // baldes diários (ou mensais em períodos longos) com a receita das vendas válidas
  const pts = [];
  if (pr.porMes) { let m = pr.ini.slice(0, 7); const f = pr.fim.slice(0, 7); while (m <= f) { pts.push({ k: m, rot: nomeMes(m), v: soma(vendasValidas(vendas.filter(v => v.data.startsWith(m))), v => v.valor) }); m = somaMes(m, 1); } }
  else { let d = pr.ini; while (d <= pr.fim) { const dd = d; pts.push({ k: dd, rot: dd.slice(8) + "/" + dd.slice(5, 7), v: soma(vendasValidas(vendas.filter(v => v.data === dd)), v => v.valor) }); d = somaDias(d, 1); } }
  if (pts.length === 1) pts.unshift({ k: "", rot: "", v: 0 });
  const W = 600, H = 200, max = Math.max(1, ...pts.map(p => p.v)) * 1.15, n = pts.length;
  const xy = pts.map((p, i) => [i / (n - 1) * W, H - p.v / max * (H - 8) - 2]);
  let d = `M${xy[0][0]},${xy[0][1]}`;
  for (let i = 1; i < n; i++) { const [x0, y0] = xy[i - 1], [x1, y1] = xy[i], dx = (x1 - x0) / 2; d += ` C${x0 + dx},${y0} ${x1 - dx},${y1} ${x1},${y1}`; }
  const passo = Math.max(1, Math.ceil(n / 7));
  const yTicks = [1, .75, .5, .25, 0].map(f => Math.round(max / 1.15 * f));
  return `<div class="area" id="area">
    <div class="yl">${yTicks.map(t => `<span>${t >= 1000 ? (t / 1000).toFixed(1).replace(".0", "") + "k" : t}</span>`).join("")}</div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="padding-left:28px;box-sizing:border-box">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B6FF5" stop-opacity=".35"/><stop offset="1" stop-color="#3B6FF5" stop-opacity="0"/></linearGradient></defs>
      ${[0, .25, .5, .75].map(f => `<line x1="0" x2="${W}" y1="${f * H + 2}" y2="${f * H + 2}" stroke="#E5E9F2" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}
      <path d="${d} L${W},${H} L0,${H} Z" fill="url(#ga)"/>
      <path d="${d}" fill="none" stroke="#2F5FE8" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="xl" style="padding-left:28px">${pts.filter((p, i) => i % passo === 0 || i === n - 1).map(p => `<span>${p.rot}</span>`).join("")}</div>
    <div class="tip" id="areaTip"></div></div>`;
  // (os pontos ficam em window.__pts para o tooltip)
}
function ligarArea(pr){
  const el = $("#area"); if (!el) return;
  const svg = el.querySelector("svg"), tip = $("#areaTip");
  const pts = [];
  if (pr.porMes) { let m = pr.ini.slice(0, 7); while (m <= pr.fim.slice(0, 7)) { pts.push({ rot: nomeMes(m), v: soma(vendasValidas(vendas.filter(v => v.data.startsWith(m))), v => v.valor), q: vendasValidas(vendas.filter(v => v.data.startsWith(m))).length }); m = somaMes(m, 1); } }

  svg.onmousemove = e => {

}

}
let EDIT = false, GS = null, avisoCel = false;
function iniciarGrade(){
  if (GS) { try { GS.destroy(false); } catch (e) {} GS = null; }
  const el = $("#gs"); if (!el) return;
  if (innerWidth < 820 || !window.GridStack) {
    // celular (ou biblioteca indisponível): um bloco embaixo do outro, na ordem montada no computador
    el.classList.add("gs-plano");
    [...el.children].sort((a, b) => ((+a.getAttribute("gs-y") || 0) - (+b.getAttribute("gs-y") || 0)) || ((+a.getAttribute("gs-x") || 0) - (+b.getAttribute("gs-x") || 0))).forEach(c => el.appendChild(c));
    if (EDIT) { EDIT = false; toast("Para montar o painel, use o computador. No celular os blocos ficam um embaixo do outro."); setTimeout(painel, 0); }
    return;
  }
  GS = GridStack.init({ column: 12, cellHeight: 56, margin: 7, float: true, animate: true, staticGrid: !EDIT,
    handle: ".grip", columnOpts: { breakpoints: [{ w: 820, c: 1 }] }, resizable: { handles: "e,se,s,sw,w" } }, el);
  if (!EDIT) return;
  const L = layoutPainel();
  const gravar = () => {
    if (GS.getColumn() !== 12) { if (!avisoCel) { toast("Para montar o painel, use o computador — no celular os blocos ficam um embaixo do outro."); avisoCel = true; } return; }
    GS.save(false).forEach(p => { const it = L.find(x => x.id === p.id); if (it) Object.assign(it, { x: p.x, y: p.y, w: p.w, h: p.h }); });
    salvarLayout(L);
  };
  GS.on("change", gravar);
  if (L.some(b => b.vis && b.x == null)) gravar();
  el.querySelectorAll("[data-hide]").forEach(b => b.onclick = () => { const it = L.find(x => x.id === b.dataset.hide); it.vis = false; GS.removeWidget(b.closest(".grid-stack-item")); gravar(); salvarLayout(L).then(() => painel()); });
  document.querySelectorAll("[data-add]").forEach(b => b.onclick = async () => { const it = L.find(x => x.id === b.dataset.add); it.vis = true; it.x = null; it.y = null; await salvarLayout(L); painel(); });
  $("#edReset").onclick = async () => { await salvarLayout(LAY_PADRAO.map(x => ({ ...x }))); painel(); };
  $("#edOk").onclick = () => { EDIT = false; painel(); toast("Painel salvo ✅"); };
}

  const baixaDe = cor => { const pr = prodCor(cor); return pr && id ? -soma(movs.filter(m => m.venda_id === id && m.produto_id === pr.id), m => m.qtd) : 0; };
  const qA0 = v.cor === "mista" ? baixaDe("azul") : 0, qP0 = v.cor === "mista" ? baixaDe("preta") : 0;

    <div id="blocoPlaca">
      <label class="f"><span>Kit</span></label>
      <div class="kits">${K.kits.map(k => `<button type="button" data-q="${k.qtd}" data-p="${k.preco}" class="${v.qtd==k.qtd && Number(v.valor)==k.preco ? "on" : ""}"><b>${k.qtd} placa${k.qtd>1?"s":""}</b>${brl(k.preco)}</button>`).join("")}</div>
      <div class="row">
        <label class="f"><span>Placas</span><input class="in num" name="qtd" type="number" min="1" value="${v.qtd || 1}"></label>
        <div><label class="f"><span>Cor</span></label>
        <div class="seg" data-seg="cor">${["azul","preta","mista"].map(x => `<button type="button" data-val="${x}" class="${(v.cor||"azul")===x?"on":""}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div></div>
      </div>
      <div class="row hide" id="mistaBox">
        <label class="f"><span>Quantas azuis</span><input class="in num" name="qAzul" type="number" min="0" value="${qA0}"></label>
        <label class="f"><span>Quantas pretas</span><input class="in num" name="qPreta" type="number" min="0" value="${qP0}"></label>
      </div>
    </div>
    <div id="blocoInsta" class="hide"><label class="f"><span>Quantas plaquinhas Instagram</span><input class="in num" name="qInsta" type="number" min="1" value="${v.qtd_insta || 1}"></label></div>
    <p class="hint" id="estHint"></p>
    <div class="row">
      <label class="f"><span>Valor (R$)</span><input class="in num" name="valor" inputmode="decimal" value="${String(v.valor).replace(".",",")}" required></label>
      <label class="f"><span>Custo (R$)</span><input class="in num" name="custo" inputmode="decimal" value="${String(v.custo||0).replace(".",",")}"></label>

    <p class="hint">Custo = quanto a empresa gastou nessa venda. Com placa, é calculado pelo custo médio do estoque (pode mudar à mão).</p>

    <div class="seg" data-seg="status">${Object.entries(ST_VENDA).map(([k,t]) => `<button type="button" data-val="${k}" class="${v.status===k?"on":""}">${t}</button>`).join("")}</div>
    <div class="row">
      <label class="f"><span>Data</span><input class="in" name="data" type="date" value="${v.data}" required></label>
      <label class="f"><span>Vendedor</span><select class="in" name="vendedor_id">${equipe.filter(p => p.ativo || p.id === v.vendedor_id).map(p => `<option value="${p.id}" ${p.id===v.vendedor_id?"selected":""}>${esc(p.nome||p.email)}</option>`).join("")}</select></label>
      <label class="f"><span>Canal</span><select class="in" name="canal">${CANAIS.map(x => `<option ${v.canal===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f"><span>Pagamento</span><select class="in" name="pagamento">${PAGTOS.map(x => `<option ${v.pagamento===x?"selected":""}>${x}</option>`).join("")}</select></label>
    </div>
    <label class="f"><span>Observação</span><textarea class="in" name="obs" placeholder="Endereço de entrega, combinado, etc.">${esc(v.obs||"")}</textarea></label>`,
  async f => {
    if (!servSel().length) { toast("Marque o que foi feito"); throw new Error("sem serviço"); }
    const nomeEmp = f.empresa.value.trim();
    let cli = clientes.find(x => x.empresa.trim().toLowerCase() === nomeEmp.toLowerCase());
    const status = segVal("status");
    if (!cli && G && G.maps) cli = clientes.find(x => x.google_link === G.maps);
    if (!cli) cli = await salvar("clientes", { empresa: nomeEmp, telefone: f.telefone.value.trim() || null, cidade: f.cidade.value.trim() || null,
      google_link: G ? G.maps || null : null, place_id: G ? G.id || null : null, segmento: G ? G.type || null : null, obs: G && G.address ? "Endereço: " + G.address : null,
      status: status === "cancelado" ? "negociando" : "cliente" });
    else if (status !== "cancelado" && ["lead","contato","agendado","negociando","perdido"].includes(cli.status)) await salvar("clientes", { status: "cliente" }, cli.id);
    if (G && G.id && !hist.some(h => h.cliente_id === cli.id)) await registrarAval(cli.id, G.rating, G.count);
    const pl = placas();
    const venda = await salvar("vendas", { cliente_id: cli.id, servicos: servSel(), qtd: pl.total, qtd_insta: pl.insta, valor: num(f.valor.value), custo: num(f.custo.value), cor: pl.total ? pl.cor : null, status, data: f.data.value, vendedor_id: f.vendedor_id.value, canal: f.canal.value, pagamento: f.pagamento.value, obs: f.obs.value.trim() || null }, id);
    await baixaEstoque(venda, status === "cancelado" ? {} : pl.porCor);
    return id ? "Venda atualizada" : "Venda registrada 🎉";
  }, id && me.papel === "admin" ? () => excluir("vendas", id) : null);
  const f = $("#dlg form");
  const existe = () => clientes.some(x => x.empresa.trim().toLowerCase() === f.empresa.value.trim().toLowerCase());
  const atualiza = () => $("#novoCli").classList.toggle("hide", existe() || !f.empresa.value.trim());
  buscaEmpresa(f.empresa, {
    locais: true,
    aoDigitar: () => { G = null; $("#vincBox").innerHTML = ""; atualiza(); },
    aoEscolher: (r) => {
      if (r.cliente) { G = null; f.empresa.value = r.cliente.empresa; $("#vincBox").innerHTML = cartaoCliente(r.cliente); atualiza(); return; }
      const ja = clientes.find(x => x.google_link && x.google_link === r.place.maps);
      if (ja) { G = null; f.empresa.value = ja.empresa; $("#vincBox").innerHTML = cartaoCliente(ja); atualiza(); return; }
      G = r.place; f.empresa.value = G.name; f.telefone.value = G.phone; f.cidade.value = G.cidade;
      $("#vincBox").innerHTML = cartaoGoogle(G); atualiza();
    }
  });
  if (c) $("#vincBox").innerHTML = cartaoCliente(c);
  function servSel(){ return [...f.querySelectorAll("#servs button.on")].map(b => b.dataset.sv); }
  function placas(){
    const sv = servSel(), porCor = {}; let total = 0, cor = null;
    if (sv.includes("placa")) {
      cor = segVal("cor") || "azul";
      if (cor === "mista") { const a = Math.max(0, +f.qAzul.value || 0), p = Math.max(0, +f.qPreta.value || 0); porCor.azul = a; porCor.preta = p; total = a + p; }
      else { total = Math.max(1, +f.qtd.value || 1); porCor[cor] = total; }
    }
    const insta = sv.includes("instagram") ? Math.max(1, +f.qInsta.value || 1) : 0;
    if (insta) porCor.instagram = insta;
    return { total, cor, porCor, insta };
  }
  function recalcular(){
    const temPlaca = servSel().includes("placa"), cor = segVal("cor");
    $("#blocoPlaca").classList.toggle("hide", !temPlaca);
    $("#blocoInsta").classList.toggle("hide", !servSel().includes("instagram"));
    $("#mistaBox").classList.toggle("hide", cor !== "mista");
    f.qtd.readOnly = cor === "mista";
    const pl = placas();
    if (cor === "mista") f.qtd.value = pl.total;
    const est = ["azul","preta","instagram"].map(c => { const pr = prodCor(c); if (!pr) return null; const n = saldo(pr.id) + baixaDe(c); return c === "instagram" ? `${n} Instagram` : `${n} ${n === 1 ? c : (c === "azul" ? "azuis" : "pretas")}`; }).filter(Boolean);
    $("#estHint").textContent = est.length ? "Em estoque: " + est.join(" · ") + ". A baixa é automática ao salvar." : "";
    if (!custoManual) {
      const c = Object.entries(pl.porCor).reduce((a, [cr, q]) => { const pr = prodCor(cr); return a + (pr ? q * custoMedio(pr.id) : 0); }, 0);
      f.custo.value = (Math.round(c * 100) / 100).toFixed(2).replace(".", ",");
    }
  }
  f.querySelectorAll("#servs button").forEach(b => b.onclick = () => { b.classList.toggle("on"); recalcular(); });
  f.custo.addEventListener("input", () => { custoManual = true; });
  f.qtd.addEventListener("input", () => { custoManual = false; recalcular(); });
  f.qAzul.addEventListener("input", () => { custoManual = false; recalcular(); });
  f.qPreta.addEventListener("input", () => { custoManual = false; recalcular(); });
  f.qInsta.addEventListener("input", () => { custoManual = false; recalcular(); });
  $("#dlg")._onSeg = () => { custoManual = false; recalcular(); };
  f.querySelectorAll(".kits button").forEach(b => b.onclick = () => {
    f.querySelectorAll(".kits button").forEach(x => x.classList.toggle("on", x === b));
    f.qtd.value = b.dataset.q; f.valor.value = String(b.dataset.p).replace(".",",");
    if (segVal("cor") === "mista") { f.qAzul.value = b.dataset.q; f.qPreta.value = 0; }
    custoManual = false; recalcular();
  });
  recalcular();
}

/* baixa automática do estoque de uma venda (refaz a cada edição) */
async function baixaEstoque(venda, porCor){
  try {
    const { error } = await sb.from("movimentos").delete().eq("venda_id", venda.id);
    if (error) throw error;
    const linhas = Object.entries(porCor || {}).filter(([, q]) => q > 0).map(([cor, q]) => { const pr = prodCor(cor); return pr && {
      produto_id: pr.id, tipo: "saida", qtd: -q, custo_unit: Math.round(custoMedio(pr.id) * 100) / 100, venda_id: venda.id, data: venda.data, obs: "Venda" }; }).filter(Boolean);
    if (linhas.length) { const r = await sb.from("movimentos").insert(linhas); if (r.error) throw r.error; }
  } catch (e) { toast("Venda salva, mas a baixa do estoque falhou: " + e.message); }
}

    ${id ? `<div class="atv"><div class="av-h">Agenda e histórico de contato</div>
      <div class="atv-form"><select class="in" id="aTipo">${Object.entries(TIPOS_ATIV).map(([k,t]) => `<option value="${k}">${t}</option>`).join("")}</select><input class="in" id="aQuando" type="datetime-local" value="${localDT(new Date())}"></div>
      <div class="atv-form" style="grid-template-columns:1fr auto;margin-top:8px"><input class="in" id="aObs" placeholder="O que foi falado / o que vai fazer"><button type="button" class="btn" id="aAdd">Registrar</button></div>
      <p class="hint">Data no futuro = agenda (aparece nos lembretes). Data de agora ou passada = registro de contato feito.</p>

    ${hist.length ? `<div class="hist"><div><span>Compras</span><span class="num">${brl(soma(vendasValidas(hist), v=>v.valor))}</span></div>${hist.map(v => `<div><span>${v.data.split("-").reverse().join("/")} · ${esc(servTxt(v))} · ${ST_VENDA[v.status]}</span><span class="num">${brl(v.valor)}</span></div>`).join("")}</div>` : ""}`,

  const fc = $("#dlg form");

      const tipo = $("#aTipo").value, q = $("#aQuando").value ? new Date($("#aQuando").value) : new Date();
      const futuro = q > new Date(Date.now() + 5 * 60000);
      try {
        const nova = await salvar("atividades", { cliente_id: id, tipo, quando: q.toISOString(), feito: !futuro, obs: $("#aObs").value.trim() || null });

        const st = segVal("status"); let novo = null;
        if (futuro && ["visita","call","reuniao"].includes(tipo) && ["lead","contato"].includes(st)) novo = "agendado";
        else if (!futuro && tipo !== "nota" && st === "lead") novo = "contato";
        if (novo) { await salvar("clientes", { status: novo }, id); c.status = novo; $(`#dlg [data-seg="status"] [data-val="${novo}"]`).click(); toast("Etapa do funil: " + ST_CLI[novo]); }
        else toast(futuro ? "Agendado ✅" : "Contato registrado");
        pendente = true;
      } catch (e) {}
    };
  }
}

/* ===================== FINANCEIRO ===================== */
function telaFin(){
  const n = numerosDoMes(mes);
  const lista = n.ls.filter(l => !F.lTipo || l.tipo === F.lTipo);
  const cats = {};
  if (n.custoVendas) cats["Custo das vendas"] = n.custoVendas;
  n.ls.filter(l => l.tipo !== "entrada").forEach(l => { const k = l.categoria || TIPOS[l.tipo]; cats[k] = (cats[k]||0) + Number(l.valor); });
  const catArr = Object.entries(cats).sort((a,b) => b[1]-a[1]);
  const maxC = Math.max(1, ...catArr.map(x => x[1]));

function abrirMov(tipo, id, produtoId){

    <label class="f"><span>Produto</span><select class="in" name="produto_id">${produtos.filter(p => p.ativo || p.id === m.produto_id).map(p => `<option value="${p.id}" ${p.id===m.produto_id?"selected":""}>${esc(p.nome)} (saldo ${saldo(p.id)})</option>`).join("")}</select></label>
    ${ent ? `<div class="row">
      <label class="f"><span>Quantidade comprada</span><input class="in num" name="qtd" type="number" min="1" required value="${m.qtd}"></label>
      <label class="f"><span>Valor total pago (R$)</span><input class="in num" name="total" inputmode="decimal" required value="${m.qtd ? String(Math.round(m.qtd * m.custo_unit * 100) / 100).replace(".",",") : ""}" placeholder="0,00"></label>
    </div><p class="hint" id="unitHint">Inclua frete e taxas da compra para o custo ficar certo.</p>` : `
      <label class="f"><span>Quantidade (use negativo para tirar)</span><input class="in num" name="qtd" type="number" required value="${m.qtd}" placeholder="Ex.: -2 (quebrou) ou 5 (achei)"></label>`}
    <div class="row">
      <label class="f"><span>Data</span><input class="in" name="data" type="date" required value="${m.data}"></label>
      <label class="f"><span>${ent ? "Fornecedor / obs." : "Motivo"}</span><input class="in" name="obs" value="${esc(m.obs||"")}" placeholder="${ent ? "Ex.: Fornecedor X" : "Ex.: placa com defeito"}"></label>
    </div>`,

async function placeDoCliente(c){
  if (c.place_id) return c.place_id;
  if (!c.google_link) return null;
  try {
    const r = await fetch("https://places.googleapis.com/v1/places:searchText", { method: "POST",
      headers: { "Content-Type": "application/json", "X-Goog-Api-Key": K.googleApiKey, "X-Goog-FieldMask": "places.id,places.googleMapsUri" },
      body: JSON.stringify({ textQuery: [c.empresa, c.cidade].filter(Boolean).join(" "), languageCode: "pt-BR", regionCode: "br", pageSize: 5 }) });
    const d = await r.json(); const ps = d.places || [];
    const cid = (c.google_link.match(/cid=(\d+)/) || [])[1];
    const achou = (cid && ps.find(p => (p.googleMapsUri || "").includes(cid))) || ps[0];
    if (!achou) return null;
    await sb.from("clientes").update({ place_id: achou.id }).eq("id", c.id);
    c.place_id = achou.id; return achou.id;
  } catch (e) { return null; }
}

function autoRanking(){

  });

      <div class="card kpi"><small>Última atualização</small><b class="num">${fmtData(ultimaGeral)}</b><em>Atualiza sozinho toda semana ao abrir a central</em></div>

        <div style="text-align:center;font-size:18px">${medalha(i)}</div>

/* ===================== atualização automática ===================== */
let recarregando = false, pendente = false, tAoVivo = null, ultimaSync = 0, estadoCanal = "", aoVivoIniciado = false;
function digitando(){ const a = document.activeElement; return !!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && $("#view").contains(a)); }
function marcarSync(st){
  if (typeof st === "string") estadoCanal = st;
  document.querySelectorAll(".sync").forEach(el => {
    if (el.querySelector(".syncbtn")) return;
    el.innerHTML = `<button class="syncbtn" title="Atualizar agora"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg><span>Atualizar</span></button>`;
    el.querySelector(".syncbtn").onclick = async e => { const b = e.currentTarget; b.classList.add("girando"); await recarregarAoVivo(); setTimeout(() => b.classList.remove("girando"), 400); toast("Atualizado"); };
  });
}
async function recarregarAoVivo(){
  if (!me || !me.ativo) return;
  if (recarregando) { pendente = true; return; }
  recarregando = true;
  try {
    await carregar(); ultimaSync = Date.now(); marcarSync();
    if ($("#dlg").open || digitando() || (view === "painel" && EDIT)) pendente = true;
    else {
      const y = scrollY, rl = (document.querySelector(".rolagem") || {}).scrollTop;
      render(); scrollTo(0, y);
      const r2 = document.querySelector(".rolagem"); if (r2 && rl) r2.scrollTop = rl;
    }
  } catch (e) {} finally { recarregando = false; }
}
const agendarAoVivo = () => { clearTimeout(tAoVivo); tAoVivo = setTimeout(recarregarAoVivo, 800); };
function iniciarAoVivo(){
  if (aoVivoIniciado) return; aoVivoIniciado = true;
  try { sb.channel("central-ao-vivo").on("postgres_changes", { event: "*", schema: "public" }, agendarAoVivo).subscribe(st => marcarSync(st)); } catch (e) {}
  setInterval(() => { if (!document.hidden) recarregarAoVivo(); }, 60000);
  setInterval(marcarSync, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - ultimaSync > 15000) recarregarAoVivo(); });
  $("#dlg").addEventListener("close", () => { if (pendente) { pendente = false; setTimeout(recarregarAoVivo, 300); } });
  $("#view").addEventListener("focusout", () => setTimeout(() => { if (pendente && !digitando() && !$("#dlg").open) { pendente = false; recarregarAoVivo(); } }, 200));
  marcarSync();
}

function blocoCobrancas(){
  const cs = cobrancas(); if (!cs.length) return "";
  return `<div class="av-h">💰 Lembrar de cobrar · ${cs.length} · ${brl(soma(cs, v => v.valor))}</div>` + cs.map(v => {
    const c = cliente(v.cliente_id) || {}, d = diasEntre(v.data, hoje()), l = linkCobrar(v);
    return `<div class="av-item"><div style="min-width:0"><b>${esc(c.empresa || "Sem cliente")}</b><small class="${d >= 3 ? "late" : ""}">${brl(v.valor)} · ${d <= 0 ? "vendido hoje" : "há " + d + " dia" + (d > 1 ? "s" : "")}${c.telefone ? "" : " · sem WhatsApp"}</small></div>
      <div class="acts">${l ? `<a class="btn sm" style="background:#25D366" target="_blank" rel="noopener" href="${esc(l)}">Cobrar</a>` : ""}<button class="btn ghost sm" data-pago="${v.id}">Recebi</button></div></div>`; }).join("");
}
function blocoAgenda(){
  const ag = agendaPendente(); if (!ag.length) return "";
  return `<div class="av-h">📅 Agenda de hoje e atrasados · ${ag.length}</div>` + ag.map(a => {
    const c = cliente(a.cliente_id) || {}, late = new Date(a.quando) < new Date(new Date().setHours(0, 0, 0, 0));
    return `<div class="av-item"><div style="min-width:0;cursor:pointer" data-cli="${a.cliente_id}"><b>${TIPOS_ATIV[a.tipo]} · ${esc(c.empresa || "—")}</b><small class="${late ? "late" : ""}">${fmtDT(a.quando)}${late ? " · atrasado" : ""}${a.obs ? " · " + esc(a.obs) : ""}</small></div>
      <div class="acts">${zap(c.telefone) ? `<a class="btn ghost sm" target="_blank" rel="noopener" href="${zap(c.telefone)}">WhatsApp</a>` : ""}<button class="btn sm" data-feito="${a.id}">Feito</button></div></div>`; }).join("");
}
function blocoLeads(){
  const lp = leadsParados(); if (!lp.length) return "";
  return `<div class="av-h">🆕 Leads novos sem contato · ${lp.length}</div><div class="av-item"><div><b>${lp.slice(0, 3).map(c => esc(c.empresa)).join(", ")}${lp.length > 3 ? " e mais " + (lp.length - 3) : ""}</b><small>Registre o primeiro contato para o lead andar no funil</small></div><div class="acts"><button class="btn sm" data-crm>Abrir funil</button></div></div>`;
}
function blocoEstoque(){
  const bx = produtos.filter(p => p.ativo && saldo(p.id) <= p.minimo); if (!bx.length) return "";
  return `<div class="av-h">📦 Estoque para repor</div>` + bx.map(p => `<div class="av-item"><div><b>${esc(p.nome)}</b><small class="late">${saldo(p.id)} em estoque · mínimo ${p.minimo}</small></div><div class="acts"><button class="btn ghost sm" data-go="estoque">Ver</button></div></div>`).join("");
}
function cardAvisos(){
  const esq = blocoCobrancas(), dir = blocoAgenda() + blocoLeads() + blocoEstoque();
  if (!esq && !dir) return `<div class="card avisos" style="border-left-color:var(--ok)"><b>✅ Tudo em dia</b> <span class="hint">Sem cobranças pendentes, compromissos atrasados ou leads parados.</span></div>`;
  return `<div class="card avisos"><h3>⚡ Atenção agora</h3><div class="cols"><div>${esq || `<div class="av-h">💰 Cobranças</div><p class="hint">Nenhuma venda pendente. 👏</p>`}</div><div>${dir || `<div class="av-h">📅 Agenda</div><p class="hint">Nada para hoje.</p>`}</div></div></div>`;
}
function cardCobrancaFin(){
  const venc = lanc.filter(l => l.tipo !== "entrada" && !l.pago && l.data <= hoje()).sort((a, b) => a.data < b.data ? -1 : 1);
  const bc = blocoCobrancas();
  const bp = venc.length ? `<div class="av-h">🧾 Contas a pagar vencidas · ${brl(soma(venc, l => l.valor))}</div>` + venc.map(l => `<div class="av-item"><div style="cursor:pointer" data-lanc="${l.id}"><b>${esc(l.descricao)}</b><small class="late">venceu ${l.data.split("-").reverse().join("/")} · ${brl(l.valor)}</small></div><div class="acts"><button class="btn ghost sm" data-pagar="${l.id}">Paguei</button></div></div>`).join("") : "";
  return `<div class="card avisos" style="${bc || bp ? "" : "border-left-color:var(--ok)"}"><h3>Lembretes</h3>${bc || `<p class="hint">Nenhuma venda pendente de pagamento. 👏</p>`}${bp}</div>`;
}
function ligarAvisos(){
  document.querySelectorAll("[data-pago]").forEach(b => b.onclick = async () => { b.disabled = true; try { await salvar("vendas", { status: "pago" }, +b.dataset.pago); await carregar(); render(); toast("Pagamento registrado 💰"); } catch (e) { b.disabled = false; } });
  document.querySelectorAll("[data-pagar]").forEach(b => b.onclick = async () => { b.disabled = true; try { await salvar("lancamentos", { pago: true }, +b.dataset.pagar); await carregar(); render(); toast("Conta marcada como paga"); } catch (e) { b.disabled = false; } });
  document.querySelectorAll("[data-feito]").forEach(b => b.onclick = async () => { b.disabled = true; try { await salvar("atividades", { feito: true }, +b.dataset.feito); await carregar(); render(); toast("Feito ✅"); } catch (e) { b.disabled = false; } });
  document.querySelectorAll("[data-crm]").forEach(b => b.onclick = () => { F.cModo = "crm"; ir("clientes"); });
  document.querySelectorAll(".avisos [data-go]").forEach(b => b.onclick = () => ir(b.dataset.go));
}

/* ===================== CRM (funil em colunas) ===================== */
function telaCRM(){
  const q = F.crmBusca.toLowerCase();
  const lista = clientes.filter(c => (!F.crmVend || c.vendedor_id === F.crmVend) && (!q || [c.empresa, c.cidade, c.segmento, c.contato].some(x => (x || "").toLowerCase().includes(q))));
  const ultAval = cid => { const hs = hist.filter(h => h.cliente_id === cid); return hs[hs.length - 1]; };
  const ordem = Object.keys(ST_CLI);
  const card = c => {
    const pa = proximaAtiv(c.id), late = pa && new Date(pa.quando) < new Date(), av = ultAval(c.id), i = ordem.indexOf(c.status);
    return `<div class="kcard" draggable="true" data-k="${c.id}">
      <b>${esc(c.empresa)}</b>
      <small>${esc([c.segmento, c.cidade].filter(Boolean).join(" · ") || "—")}${av ? ` · ⭐ ${av.rating != null ? String(av.rating).replace(".", ",") : "—"} (${av.total})` : ""}</small>
      ${pa ? `<div class="prox ${late ? "late" : ""}">${TIPOS_ATIV[pa.tipo]} ${fmtDT(pa.quando)}${late ? " · atrasado" : ""}</div>` : ["lead","contato","agendado","negociando"].includes(c.status) ? `<div class="prox" style="color:var(--muted)">Sem próximo passo</div>` : ""}
      <div class="kact">${zap(c.telefone) ? `<a class="wa" href="${zap(c.telefone)}" target="_blank" rel="noopener" data-stop>WhatsApp</a>` : ""}${i > 0 ? `<button data-mv="${c.id}" data-to="${ordem[i - 1]}" title="Voltar etapa">‹</button>` : ""}${i < ordem.length - 1 ? `<button data-mv="${c.id}" data-to="${ordem[i + 1]}" title="Avançar etapa">›</button>` : ""}</div></div>`;
  };
  $("#view").innerHTML = `
    <div class="top"><h2>Clientes</h2>${abasClientes()}</div>
    <div class="tools"><input class="in" id="crmBusca" placeholder="Buscar no funil" value="${esc(F.crmBusca)}"><select class="in" id="crmVend"><option value="">Todos os responsáveis</option>${equipe.map(p => `<option value="${p.id}" ${F.crmVend===p.id?"selected":""}>${esc(p.nome||p.email)}</option>`).join("")}</select></div>
    <div class="kanban">${ordem.map(st => { const cs = lista.filter(c => c.status === st); return `<div class="kcol" data-col="${st}">
      <h4><span class="pill p-${st}">${ST_CLI[st]}</span><span class="hint">${cs.length}</span></h4>
      <div class="kbody">${cs.map(card).join("") || `<p class="hint" style="padding:6px 4px">Arraste um card para cá</p>`}</div></div>`; }).join("")}</div>
    <p class="hint">Arraste os cards entre as colunas (ou use ‹ ›). Toque no card para abrir o cliente e registrar ligação, visita, call ou reunião.</p>`;
  ligarAbasClientes();
  $("#crmBusca").oninput = e => { F.crmBusca = e.target.value; const p = e.target.selectionStart; telaCRM(); const i = $("#crmBusca"); i.focus(); i.setSelectionRange(p, p); };
  $("#crmVend").onchange = e => { F.crmVend = e.target.value; telaCRM(); };
  const mover = async (cid, st) => { const c = clientes.find(x => x.id === cid); if (!c || c.status === st) return; c.status = st; telaCRM(); try { await salvar("clientes", { status: st }, cid); toast(esc(c.empresa) + " → " + ST_CLI[st]); } catch (e) { await carregar(); telaCRM(); } };
  document.querySelectorAll(".kcard").forEach(k => {
    k.onclick = e => { if (e.target.closest("[data-mv],[data-stop]")) return; abrirCliente(+k.dataset.k); };
    k.ondragstart = e => { e.dataTransfer.setData("text/plain", k.dataset.k); e.dataTransfer.effectAllowed = "move"; };
  });
  document.querySelectorAll("[data-mv]").forEach(b => b.onclick = e => { e.stopPropagation(); mover(+b.dataset.mv, b.dataset.to); });
  document.querySelectorAll(".kcol").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("over"); };
    col.ondragleave = () => col.classList.remove("over");
    col.ondrop = e => { e.preventDefault(); col.classList.remove("over"); const cid = +e.dataTransfer.getData("text/plain"); if (cid) mover(cid, col.dataset.col); };
  });
}

/* ===================== PROSPECÇÃO ===================== */
const SEGS = ["Barbearia","Salão de beleza","Restaurante","Hamburgueria","Pizzaria","Lanchonete","Cafeteria","Padaria","Clínica odontológica","Clínica de estética","Academia","Pet shop","Clínica veterinária","Oficina mecânica","Auto peças","Lava-rápido","Loja de roupas","Loja de celulares","Ótica","Farmácia","Imobiliária","Móveis planejados","Escola de idiomas","Mercado","Sorveteria","Tabacaria","Distribuidora de bebidas"];
let PROSP = { seg: "", cidade: "Barretos", res: [], token: null, ordem: "menos", soTel: false, esconder: false, busca: "" };
try { Object.assign(PROSP, JSON.parse(sessionStorage.getItem("prosp") || "{}")); } catch (e) {}
const guardarProsp = () => { try { sessionStorage.setItem("prosp", JSON.stringify(PROSP)); } catch (e) {} };
const naCarteira = p => clientes.find(c => (c.place_id && c.place_id === p.id) || (c.google_link && p.maps && c.google_link === p.maps));
let buscandoProsp = false;
async function buscarProsp(mais){
  if (buscandoProsp) return;
  const seg = PROSP.seg.trim(), cid = PROSP.cidade.trim();
  if (!seg || !cid) { toast("Informe o segmento e a cidade"); return; }
  if (!K.googleApiKey) { toast("Chave do Google não carregou"); return; }
  buscandoProsp = true; telaProsp();
  try {
    const body = { textQuery: `${seg} em ${cid}`, languageCode: "pt-BR", regionCode: "br", pageSize: 20 };
    if (mais && PROSP.token) body.pageToken = PROSP.token;
    const r = await fetch("https://places.googleapis.com/v1/places:searchText", { method: "POST",
      headers: { "Content-Type": "application/json", "X-Goog-Api-Key": K.googleApiKey,
        "X-Goog-FieldMask": "nextPageToken,places.id,places.displayName,places.formattedAddress,places.addressComponents,places.rating,places.userRatingCount,places.nationalPhoneNumber,places.googleMapsUri,places.primaryTypeDisplayName,places.websiteUri,places.businessStatus" },
      body: JSON.stringify(body) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const novos = (d.places || []).filter(x => x.businessStatus !== "CLOSED_PERMANENTLY").map(x => {
      const comp = x.addressComponents || [];
      return { id: x.id, name: x.displayName?.text || "", address: x.formattedAddress || "",
        cidade: (comp.find(c => (c.types||[]).includes("administrative_area_level_2")) || comp.find(c => (c.types||[]).includes("locality")) || {}).longText || cid,
        rating: x.rating ?? null, count: x.userRatingCount || 0, phone: x.nationalPhoneNumber || "", maps: (x.googleMapsUri || "").split("&g_mp=")[0],
        type: x.primaryTypeDisplayName?.text || seg, site: x.websiteUri || "" };
    });
    PROSP.res = mais ? [...PROSP.res, ...novos.filter(n => !PROSP.res.some(o => o.id === n.id))] : novos;
    PROSP.token = d.nextPageToken || null; PROSP.busca = `${seg} em ${cid}`;
    guardarProsp();
    if (!novos.length) toast("Nada encontrado. Tente outro segmento ou cidade.");
  } catch (e) { toast("Busca do Google falhou: " + e.message); }
  buscandoProsp = false; telaProsp();
}
async function importarLeads(lista){
  let n = 0;
  for (const p of lista) {
    if (naCarteira(p)) continue;
    try {
      const c = await salvar("clientes", { empresa: p.name, telefone: p.phone || null, cidade: p.cidade || null, segmento: p.type || null, google_link: p.maps || null,
        place_id: p.id, status: "lead", origem: "prospeccao", vendedor_id: me.id, obs: [p.address ? "Endereço: " + p.address : "", p.site ? "Site: " + p.site : ""].filter(Boolean).join("\n") || null });
      clientes.push(c); await registrarAval(c.id, p.rating, p.count); n++;
    } catch (e) { break; }
  }
  await carregar(); telaProsp();
  if (n) toast(n === 1 ? "Lead adicionado ao funil 🎯" : n + " leads adicionados ao funil 🎯");
}
function telaProsp(){
  let lista = PROSP.res.slice();
  if (PROSP.soTel) lista = lista.filter(p => p.phone);
  if (PROSP.esconder) lista = lista.filter(p => !naCarteira(p));
  const ord = { menos: (a, b) => a.count - b.count, mais: (a, b) => b.count - a.count, nota: (a, b) => (a.rating ?? 0) - (b.rating ?? 0) }[PROSP.ordem];
  lista.sort(ord);
  const fora = lista.filter(p => !naCarteira(p));
  const oport = lista.filter(p => p.count < 20).length;
  $("#view").innerHTML = `
    <div class="top"><h2>Prospecção</h2></div>
    <div class="card" style="margin-bottom:14px">
      <div class="pform">
        <input class="in" id="pSeg" list="dlSegs" placeholder="Segmento (ex.: Barbearia)" value="${esc(PROSP.seg)}">
        <input class="in" id="pCid" placeholder="Cidade" value="${esc(PROSP.cidade)}">
        <button class="btn" id="pBuscar" ${buscandoProsp ? "disabled" : ""}>${buscandoProsp ? "Buscando…" : "🔎 Buscar no Google"}</button>
      </div>
      <datalist id="dlSegs">${SEGS.map(x => `<option value="${x}">`).join("")}</datalist>
      <p class="hint">Mostra as empresas da região com <b>menos avaliações</b> primeiro: são as que mais precisam da placa. Cada busca traz até 20; dá para buscar mais.</p>
    </div>
    ${PROSP.res.length ? `
    <div class="grid kpis" style="margin-bottom:14px">
      <div class="card kpi"><small>Encontradas</small><b class="num">${PROSP.res.length}</b><em>${esc(PROSP.busca)}</em></div>
      <div class="card kpi"><small>Oportunidades</small><b class="num">${oport}</b><em>Com menos de 20 avaliações</em></div>
      <div class="card kpi"><small>Média de avaliações</small><b class="num">${Math.round(soma(PROSP.res, p => p.count) / PROSP.res.length)}</b><em>Nota média ${(() => { const r = PROSP.res.filter(p => p.rating); return r.length ? (soma(r, p => p.rating) / r.length).toFixed(1).replace(".", ",") : "—"; })()}</em></div>
      <div class="card kpi"><small>Já na carteira</small><b class="num">${PROSP.res.filter(naCarteira).length}</b><em>${fora.length} para trazer</em></div>
    </div>
    <div class="tools" style="align-items:center">
      <div class="seg"><button data-po="menos" class="${PROSP.ordem==="menos"?"on":""}">Menos avaliações</button><button data-po="nota" class="${PROSP.ordem==="nota"?"on":""}">Nota mais baixa</button><button data-po="mais" class="${PROSP.ordem==="mais"?"on":""}">Mais avaliações</button></div>
      <label class="check" style="margin:0"><input type="checkbox" id="pTel" ${PROSP.soTel?"checked":""}> Só com telefone</label>
      <label class="check" style="margin:0"><input type="checkbox" id="pEsc" ${PROSP.esconder?"checked":""}> Esconder as da carteira</label>
      ${fora.length ? `<button class="btn sm" id="pTodos" style="margin-left:auto">+ Trazer ${fora.length} para leads</button>` : ""}
    </div>
    <div class="list">${lista.map((p, i) => { const ja = naCarteira(p); return `<div class="li" style="grid-template-columns:30px 1fr auto">
      <div class="medal">${i + 1}º</div>
      <div style="min-width:0">
        <div class="t">${esc(p.name)} ${p.count < 10 ? `<span class="pill p-oport">🔥 oportunidade</span>` : p.count < 20 ? `<span class="pill p-oport">oportunidade</span>` : ""}</div>
        <div class="s">⭐ ${p.rating != null ? String(p.rating).replace(".", ",") : "sem nota"} · <b>${p.count} avaliações</b> · ${esc(p.type)}${p.phone ? " · " + esc(p.phone) : " · sem telefone"}</div>
        <div class="s">${esc(p.address)}${p.maps ? ` · <a class="link" href="${esc(p.maps)}" target="_blank" rel="noopener">ver no Google</a>` : ""}</div>
      </div>
      <div>${ja ? `<span class="pill p-${ja.status}" style="cursor:pointer" data-cli="${ja.id}">${ST_CLI[ja.status]}</span>` : `<button class="btn sm" data-imp="${p.id}">+ Lead</button>`}</div></div>`; }).join("") || `<div class="empty"><b>Nenhum resultado com esses filtros</b></div>`}</div>
    ${PROSP.token ? `<div style="text-align:center;margin-top:12px"><button class="btn ghost" id="pMais" ${buscandoProsp ? "disabled" : ""}>Buscar mais 20</button></div>` : ""}` : `
    <div class="empty card"><b>Comece escolhendo um segmento e a cidade</b>Ex.: “Barbearia” em “Barretos”. A lista vem ordenada das que têm menos avaliações para as que têm mais.</div>`}`;
  const go = () => { PROSP.seg = $("#pSeg").value; PROSP.cidade = $("#pCid").value; buscarProsp(false); };
  $("#pBuscar").onclick = go;
  ["#pSeg", "#pCid"].forEach(s => $(s).onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); go(); } });
  $("#pSeg").onchange = () => { PROSP.seg = $("#pSeg").value; guardarProsp(); };
  $("#pCid").onchange = () => { PROSP.cidade = $("#pCid").value; guardarProsp(); };
  document.querySelectorAll("[data-po]").forEach(b => b.onclick = () => { PROSP.ordem = b.dataset.po; guardarProsp(); telaProsp(); });
  const t = $("#pTel"); if (t) t.onchange = () => { PROSP.soTel = t.checked; guardarProsp(); telaProsp(); };
  const e2 = $("#pEsc"); if (e2) e2.onchange = () => { PROSP.esconder = e2.checked; guardarProsp(); telaProsp(); };
  const m = $("#pMais"); if (m) m.onclick = () => buscarProsp(true);
  const td = $("#pTodos"); if (td) td.onclick = () => { if (confirm(`Trazer ${fora.length} empresas para a carteira como lead?`)) { td.disabled = true; importarLeads(fora); } };
  document.querySelectorAll("[data-imp]").forEach(b => b.onclick = () => { b.disabled = true; b.textContent = "…"; importarLeads(PROSP.res.filter(p => p.id === b.dataset.imp)); });
  ligarLinhas();
}

/* ===================== busca de empresa (carteira + Google) ===================== */
const novoToken = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
function cartaoGoogle(P){
  return `<div class="vinc"><span>✓</span><span><b>Vinculado ao Google</b> — ${esc(P.address || P.cidade || "")}${P.count ? `<br>⭐ ${String(P.rating).replace(".",",")} · ${P.count} avaliações` : "<br>Ainda sem avaliações no Google"}${P.type ? " · " + esc(P.type) : ""}</span>${P.maps ? `<a href="${esc(P.maps)}" target="_blank" rel="noopener" style="margin-left:auto">Ver</a>` : ""}</div>`;
}
function cartaoCliente(c){
  const extra = [c.cidade, c.telefone].filter(Boolean).map(esc).join(" · ");
  return `<div class="vinc old"><span>●</span><span><b>Cliente já cadastrado</b>${extra ? " — " + extra : ""}</span></div>`;
}
function buscaEmpresa(input, { locais = false, aoEscolher, aoDigitar }){
  const box = document.createElement("div"); box.className = "acbox hide"; input.parentNode.appendChild(box);
  let token = novoToken(), req = 0, timer = null, itens = [], sel = -1;
  const fechar = () => { box.classList.add("hide"); sel = -1; };
  const desenhar = (loc, goo, msg, completa, rotulo) => {
    itens = [...loc.map(c => ({ cliente: c })), ...goo.map(g => ({ google: g }))];
    let h = "";
    if (loc.length) h += `<h6>Na carteira</h6>` + loc.map((c, i) => `<button type="button" data-i="${i}"><b>${esc(c.empresa)}</b><small>${esc([c.cidade, ST_CLI[c.status]].filter(Boolean).join(" · "))}</small></button>`).join("");
    if (goo.length) h += `<h6>${rotulo || "No Google"}</h6>` + goo.map((g, i) => `<button type="button" data-i="${loc.length + i}"><b>${esc(g.main)}</b><small>${esc(g.sec)}</small></button>`).join("");
    if (msg) h += `<p>${msg}</p>`;
    if (completa) h += `<button type="button" data-full style="color:var(--brand);font-weight:700;border-top:1px solid var(--line)">🔎 Não achou? Fazer busca completa no Google</button>`;
    box.innerHTML = h; box.classList.toggle("hide", !h);
    box.querySelectorAll("button[data-i]").forEach(b => b.onmousedown = e => { e.preventDefault(); escolher(+b.dataset.i); });
    const bf = box.querySelector("[data-full]"); if (bf) bf.onmousedown = e => { e.preventDefault(); buscaCompleta(loc); };
  };
  async function buscaCompleta(loc){
    const t = input.value.trim(); if (t.length < 3) return;
    const my = ++req; desenhar(loc, [], "Fazendo busca completa no Google…");
    try {
      const r = await fetch("https://places.googleapis.com/v1/places:searchText", { method: "POST",
        headers: { "Content-Type": "application/json", "X-Goog-Api-Key": K.googleApiKey, "X-Goog-FieldMask": "places.id,places.displayName,places.formattedAddress" },
        body: JSON.stringify({ textQuery: t, languageCode: "pt-BR", regionCode: "br", pageSize: 8 }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json(); if (my !== req) return;
      const goo = (d.places || []).map(p => ({ id: p.id, main: p.displayName?.text || "", sec: p.formattedAddress || "" }));
      desenhar(loc, goo, goo.length ? "" : "Também não achei na busca completa. Tente incluir a cidade no nome ou cadastre à mão.", false, "Busca completa no Google");
    } catch (e) { if (my === req) desenhar(loc, [], "Busca do Google indisponível agora. Pode cadastrar à mão."); }
  }
  async function escolher(i){
    const it = itens[i]; if (!it) return; fechar();
    if (it.cliente) { aoEscolher({ cliente: it.cliente }); return; }
    input.value = it.google.main; box.classList.remove("hide"); box.innerHTML = `<p>Buscando dados no Google…</p>`;
    try {
      const r = await fetch(`https://places.googleapis.com/v1/places/${encodeURIComponent(it.google.id)}?languageCode=pt-BR&sessionToken=${encodeURIComponent(token)}`, {
        headers: { "X-Goog-Api-Key": K.googleApiKey, "X-Goog-FieldMask": "id,displayName,formattedAddress,addressComponents,rating,userRatingCount,nationalPhoneNumber,googleMapsUri,primaryTypeDisplayName" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json(); token = novoToken();
      const comp = d.addressComponents || [];
      const cidade = (comp.find(c => (c.types||[]).includes("administrative_area_level_2")) || comp.find(c => (c.types||[]).includes("locality")) || {}).longText || "";
      fechar();
      aoEscolher({ place: { id: d.id, name: d.displayName?.text || it.google.main, address: d.formattedAddress || "", cidade,
        phone: d.nationalPhoneNumber || "", maps: (d.googleMapsUri || "").split("&g_mp=")[0], type: d.primaryTypeDisplayName?.text || "",
        rating: d.rating || 0, count: d.userRatingCount || 0 } });
    } catch (e) { box.innerHTML = `<p>Não consegui puxar os dados do Google agora. Preencha à mão.</p>`; setTimeout(fechar, 2500); }
  }
  input.addEventListener("input", () => {
    if (aoDigitar) aoDigitar();
    const t = input.value.trim(); clearTimeout(timer);
    const loc = !locais || !t ? [] : clientes.filter(c => c.empresa.toLowerCase().includes(t.toLowerCase())).slice(0, 4);
    if (t.length < 3 || !K.googleApiKey) { desenhar(loc, []); return; }
    desenhar(loc, [], "Buscando no Google…");
    timer = setTimeout(async () => {
      const my = ++req;
      try {
        const r = await fetch("https://places.googleapis.com/v1/places:autocomplete", { method: "POST",
          headers: { "Content-Type": "application/json", "X-Goog-Api-Key": K.googleApiKey },
          body: JSON.stringify({ input: t, sessionToken: token, languageCode: "pt-BR", includedRegionCodes: ["br"] }) });
        if (!r.ok) throw new Error("HTTP " + r.status);
        const d = await r.json(); if (my !== req) return;
        const goo = (d.suggestions || []).map(s => s.placePrediction).filter(Boolean).slice(0, 5).map(p => ({
          id: p.placeId, main: p.structuredFormat?.mainText?.text || p.text?.text || "", sec: p.structuredFormat?.secondaryText?.text || "" }));
        if (!goo.length) { buscaCompleta(loc); return; }
        desenhar(loc, goo, "", true);
      } catch (e) { if (my === req) desenhar(loc, [], "Busca do Google indisponível agora. Pode cadastrar à mão."); }
    }, 300);
  });
  input.addEventListener("keydown", e => {
    const bs = box.querySelectorAll("button[data-i]"); if (box.classList.contains("hide") || !bs.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length; bs.forEach((b, i) => b.classList.toggle("sel", i === sel)); }
    else if (e.key === "Enter" && sel >= 0) { e.preventDefault(); escolher(+bs[sel].dataset.i); }
    else if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); fechar(); }
  });
  input.addEventListener("blur", () => setTimeout(fechar, 150));
}

/* ===================== modal genérico ===================== */
function segVal(nome){ const b = $(`#dlg [data-seg="${nome}"] button.on`); return b ? b.dataset.val : null; }
function modal(titulo, corpo, aoSalvar, aoExcluir){
  const d = $("#dlg"); d._onSeg = null;
  d.innerHTML = `<form method="dialog" novalidate>
    <div class="mh"><h3>${esc(titulo)}</h3><button type="button" data-x aria-label="Fechar">×</button></div>
    <div class="mb">${corpo}</div>
    <div class="mf">${aoExcluir ? `<button type="button" class="btn danger" data-del>Excluir</button>` : ""}<button type="button" class="btn ghost" data-x>Cancelar</button><button class="btn" data-ok>Salvar</button></div></form>`;
  const f = d.querySelector("form");
  d.querySelectorAll("[data-x]").forEach(b => b.onclick = () => d.close());
  d.querySelectorAll("[data-seg]").forEach(g => g.querySelectorAll("button").forEach(b => b.onclick = () => {
    g.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); if (d._onSeg) d._onSeg();
  }));
  f.onsubmit = async e => {
    e.preventDefault();
    if (!f.checkValidity()) { f.reportValidity(); return; }
    const ok = d.querySelector("[data-ok]"); ok.disabled = true;
    try { const m = await aoSalvar(f); d.close(); await carregar(); render(); toast(m); }
    catch(err){ ok.disabled = false; }
  };
  const del = d.querySelector("[data-del]");
  if (del) del.onclick = async () => {
    if (!confirm("Excluir de vez? Não dá para desfazer.")) return;
    try { await aoExcluir(); d.close(); await carregar(); render(); toast("Excluído"); } catch(e){}
  };
  d.showModal();
}
const d0 = $("#dlg"); d0.addEventListener("click", e => { if (e.target === d0) d0.close(); });

function ligarLinhas(){
  document.querySelectorAll("[data-venda]").forEach(r => r.onclick = () => abrirVenda(+r.dataset.venda));
  document.querySelectorAll("[data-cli]").forEach(r => r.onclick = () => abrirCliente(+r.dataset.cli));
  document.querySelectorAll("[data-lanc]").forEach(r => r.onclick = () => abrirLanc(+r.dataset.lanc));
}

function csv(nome, cab, linhas){
  const cel = x => { const s = typeof x === "number" ? String(x).replace(".",",") : String(x ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const txt = "﻿" + [cab, ...linhas].map(l => l.map(cel).join(";")).join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type:"text/csv;charset=utf-8" })); a.download = nome; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
